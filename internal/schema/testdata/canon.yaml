# The organisation's entire issue schema. One file, versioned, changed by pull request.
# There is no per-project override — that absence is the product.
version: 1

states:
  - name: todo
    category: open
  - name: in_progress
    category: active
  - name: in_review
    category: active
    requires_evidence: true
    requires_checklist: [acceptance]
  - name: done
    category: closed
  - name: abandoned
    category: closed

transitions:
  - from: todo
    to: in_progress
  - from: in_progress
    to: in_review
  - from: in_review
    to: done
  - from: in_review
    to: in_progress
  - from: todo
    to: abandoned
  - from: in_progress
    to: abandoned

fields:
  - name: title
    type: string
    required: true
  - name: priority
    type: enum
    values: [p1, p2, p3, p4]
  - name: component
    type: string
  - name: evidence
    type: text
  - name: kpi
    type: multi_enum
    values: [conversion, p95_latency, churn, cost_per_order]
  - name: acceptance
    type: checklist

issue_types:
  - name: epic
    fields: [title]
  - name: feature
    fields: [title, priority]
  - name: story
    fields: [title, priority, kpi, acceptance]
  - name: task
    fields: [title, priority]
  - name: bug
    fields: [title, priority, component]

# Nesting is a property of types, not of individual issues. A child's type must sit
# at the level below its parent's, which makes cycles impossible by construction.
# Several types may share a level: a story contains tasks and bugs alike.
hierarchy:
  levels:
    - [epic]
    - [feature]
    - [story]
    - [task, bug]
  allow_skipping: false

# Roles are org-wide policy: which roles exist and what each may do. Membership —
# who holds which role, and which team they are in — is state, and lives in the
# event log (feat-015). Making a joiner a pull request would teach people to route
# around the system.
# The organisation's teams. Which teams exist is policy and changes by pull request;
# who is in one is state and lives in the event log. Without this block "platform",
# "Platform" and "platfrom" are three teams and nothing says otherwise.
teams:
  - {name: platform, description: The core product}
  - {name: growth}
  - {name: payments}

roles:
  - name: admin
    can: [create, delete, reparent, depend, backdate, link, administer, "field:*", "transition:*"]

  - name: member
    scope: team
    can: [create, reparent, depend, link, "field:*", "transition:*"]

  - name: agent
    scope: team
    can: [create, depend, link, "field:*", "transition:todo->in_progress", "transition:in_progress->in_review"]
    # Anything an agent may not do outright becomes a proposal for a human (feat-007).
    propose: [delete, reparent, "transition:*"]

  - name: reporter
    can: [create, "field:title", "field:component"]
