<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canon</title>
<style>
  /* Primer-ish. GitHub's palette and conventions, because a tracker is not the place
     to teach somebody a new visual language: every developer already knows what a grey
     bordered surface with a 6px radius and a coloured state pill means here.

     Copied by eye rather than imported — one embedded file with no external requests
     is a property the product claims, and a CSS dependency would end it. */
  :root {
    --bg:#ffffff; --bg-inset:#f6f8fa; --bg-hover:#f6f8fa;
    --fg:#1f2328; --dim:#59636e; --faint:#818b98;
    --line:#d1d9e0; --line-soft:#d1d9e0b3;
    --accent:#0969da; --accent-bg:#ddf4ff;
    --open:#1a7f37; --open-bg:#dafbe1;
    --active:#9a6700; --active-bg:#fff8c5;
    --closed:#8250df; --closed-bg:#fbefff;
    --warn:#bc4c00; --warn-bg:#fff1e5;
    --danger:#d1242f;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --shadow:0 1px 0 rgba(31,35,40,.04);
    --radius:6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --bg-inset:#151b23; --bg-hover:#151b23;
      --fg:#f0f6fc; --dim:#9198a1; --faint:#6b7280;
      --line:#3d444d; --line-soft:#3d444db3;
      --accent:#4493f8; --accent-bg:#121d2f;
      --open:#3fb950; --open-bg:#0f2417;
      --active:#d29922; --active-bg:#2b2410;
      --closed:#ab7df8; --closed-bg:#221033;
      --warn:#db6d28; --warn-bg:#2b1a0f;
      --danger:#f85149;
      --shadow:0 1px 0 rgba(1,4,9,.2);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
              Helvetica, Arial, sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  header { display:flex; align-items:center; gap:1rem; padding:.75rem 1.5rem;
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
           background:var(--bg-inset); }
  header b { font-size:1rem; font-weight:600; letter-spacing:-.01em; }
  header .derived { color:var(--dim); font-size:12px; }
  nav { margin-left:auto; display:flex; gap:.25rem; }
  nav button { background:none; border:1px solid transparent; color:var(--fg);
               cursor:pointer; font:inherit; padding:.3rem .6rem;
               border-radius:var(--radius); display:flex; align-items:center; gap:.4rem; }
  nav button:hover { background:var(--bg-hover); border-color:var(--line-soft); }
  nav button[aria-current="true"] { font-weight:600; background:var(--bg);
                                    border-color:var(--line); box-shadow:var(--shadow); }
  main { padding:1.5rem; max-width:76rem; margin:0 auto; }

  .surface { border:1px solid var(--line); border-radius:var(--radius);
             background:var(--bg); overflow:hidden; }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:12px;
       padding:.5rem .9rem; background:var(--bg-inset);
       border-bottom:1px solid var(--line); }
  td { padding:.6rem .9rem; border-top:1px solid var(--line-soft); vertical-align:top; }
  tbody tr:first-child td { border-top:none; }
  tbody tr:hover td { background:var(--bg-hover); }
  tbody tr { cursor:pointer; }
  tr[aria-selected="true"] td { background:var(--accent-bg); }
  tr:focus { outline:2px solid var(--accent); outline-offset:-2px; }
  td.title { font-weight:600; }
  .id { font-family:var(--mono); color:var(--dim); white-space:nowrap; font-size:12px; }
  .muted { color:var(--dim); font-weight:400; }

  .state { font-size:12px; font-weight:500; padding:.1rem .6rem; border-radius:2rem;
           border:1px solid transparent; white-space:nowrap; display:inline-block; }
  .state.open   { color:var(--open);   background:var(--open-bg);   border-color:var(--open); }
  .state.active { color:var(--active); background:var(--active-bg); border-color:var(--active); }
  .state.closed { color:var(--closed); background:var(--closed-bg); border-color:var(--closed); }

  .toolbar { display:flex; gap:.5rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
  input, select { font:inherit; padding:.4rem .7rem; border:1px solid var(--line);
                  border-radius:var(--radius); background:var(--bg); color:var(--fg); }
  input:focus, select:focus { outline:none; border-color:var(--accent);
                              box-shadow:0 0 0 3px var(--accent-bg); }
  .btn { font:inherit; font-size:13px; padding:.3rem .75rem; border-radius:var(--radius);
         border:1px solid var(--line); background:var(--bg-inset); color:var(--fg);
         cursor:pointer; box-shadow:var(--shadow); }
  .btn:hover:not(:disabled) { background:var(--bg-hover); border-color:var(--dim); }
  .btn:disabled { color:var(--faint); cursor:default; border-color:var(--line-soft); }
  kbd { font-family:var(--mono); font-size:11px; border:1px solid var(--line);
        border-bottom-width:2px; border-radius:var(--radius); padding:.05rem .35rem;
        color:var(--dim); background:var(--bg-inset); }

  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(15rem,1fr)); gap:1rem; }
  .card { border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem;
          background:var(--bg); }
  .card dt { color:var(--dim); font-size:12px; margin-bottom:.2rem; }
  .card dd { margin:0; font-size:1.4rem; font-weight:600; letter-spacing:-.02em; }
  .card dd.small { font-size:13px; font-weight:400; font-family:var(--mono); }

  .finding { display:flex; gap:.75rem; padding:.6rem .9rem;
             border-top:1px solid var(--line-soft); align-items:baseline; }
  .finding:first-child { border-top:none; }
  .sev { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
         white-space:nowrap; min-width:5rem; }
  .sev.error { color:var(--danger); }
  .sev.warning { color:var(--warn); }
  .sev.note, .sev.ok { color:var(--dim); }

  .err { color:var(--danger); font-size:13px; border:1px solid var(--danger);
         background:var(--warn-bg); border-radius:var(--radius); padding:.6rem .8rem; }
  .hint { color:var(--dim); font-size:12px; margin-top:.5rem; }
  .blank { text-align:center; padding:3rem 1rem; color:var(--dim); }
  .blank h3 { margin:0 0 .4rem; color:var(--fg); font-size:1rem; }
  h2 { font-size:1.3rem; font-weight:600; letter-spacing:-.02em; margin:.2rem 0 .3rem; }
  section { margin-top:1.5rem; }
  section > h3 { font-size:12px; color:var(--dim); font-weight:600; margin:0 0 .5rem; }
  dialog { border:1px solid var(--line); border-radius:var(--radius); background:var(--bg);
           color:var(--fg); padding:0; box-shadow:0 8px 24px rgba(31,35,40,.2); }
  dialog::backdrop { background:rgba(31,35,40,.4); }
  dialog td { border:none; padding:.2rem .5rem; }

  #status { position:fixed; bottom:0; left:0; right:0; padding:.5rem 1.5rem;
            border-top:1px solid var(--line); background:var(--bg-inset);
            font-size:12px; color:var(--dim); }
</style>

<header>
  <b>Canon</b>
  <span class="derived" id="derived"></span>
  <nav>
    <button data-view="products" data-key="g p">Products <kbd>g p</kbd></button>
    <button data-view="work" data-key="g w">Work <kbd>g w</kbd></button>
    <button data-view="flow" data-key="g f">Flow <kbd>g f</kbd></button>
    <button data-view="conformance" data-key="g c">Conformance <kbd>g c</kbd></button>
  </nav>
</header>

<main id="main" aria-live="polite"></main>
<div id="status"></div>

<script>
"use strict";

// Canon shows what it derived from repositories. There is nothing to write here, so
// there is no create form, no editing and no undo: every screen is a view of somebody
// else's git history.
const state = { view: "products", detail: null, cursor: 0, status: "", blocked: false, offset: 0, limit: 50 };

const el = (id) => document.getElementById(id);
const escape = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path) {
  const res = await fetch("/api" + path, { headers: { Accept: "application/json" } });
  const text = await res.text();
  let body = null;
  try { body = JSON.parse(text); } catch { /* an error page, not JSON */ }
  return { ok: res.ok, body, text };
}

// say reports the last thing that happened. It is deliberately the only writer of the
// status bar: a render that also wrote here wiped whatever the last action reported,
// which happened three times before the rule was made explicit.
function say(message, bad) {
  const bar = el("status");
  bar.textContent = message;
  bar.style.color = bad ? "var(--danger)" : "var(--dim)";
}

const categoryOf = (status) => {
  if (["done", "abandoned"].includes(status)) return "closed";
  if (["in-progress", "in-review"].includes(status)) return "active";
  return "open";
};

const ago = (iso) => {
  if (!iso || String(iso).startsWith("0001")) return "never read";
  const secs = (Date.now() - new Date(iso).getTime()) / 1000;
  if (secs < 60) return "just now";
  if (secs < 3600) return `${Math.round(secs / 60)}m ago`;
  if (secs < 172800) return `${Math.round(secs / 3600)}h ago`;
  return `${Math.round(secs / 86400)}d ago`;
};

const duration = (d) => {
  if (d >= 1) return `${Math.round(d * 10) / 10}d`;
  const hours = d * 24;
  if (hours >= 1) return `${Math.round(hours * 10) / 10}h`;
  const mins = Math.round(hours * 60);
  return mins > 0 ? `${mins}m` : "under a minute";
};

// Every action lives here once, and both the keyboard and the pointer dispatch through
// it. Two input paths with two implementations diverge; one registry cannot.
const ACTIONS = [
  { key: "?",      name: "Keyboard help",       run: () => el("help").showModal() },
  { key: "j",      name: "Next row",            run: () => move(1) },
  { key: "k",      name: "Previous row",        run: () => move(-1) },
  { key: "Enter",  name: "Open selected",       run: open },
  { key: "Escape", name: "Back to the list",    run: back },
  { key: "r",      name: "Reload",              run: () => { render(); say("reloaded"); } },
  { key: "g p",    name: "Go to products",      run: () => go("products") },
  { key: "g w",    name: "Go to work",          run: () => go("work") },
  { key: "g f",    name: "Go to flow",          run: () => go("flow") },
  { key: "g c",    name: "Go to conformance",   run: () => go("conformance") },
];

function go(view) {
  state.view = view;
  state.detail = null;
  state.cursor = 0;
  state.offset = 0;
  render();
}

function back() {
  if (el("help").open) return el("help").close();
  if (state.detail) { state.detail = null; state.cursor = 0; render(); }
}

function rows() { return [...document.querySelectorAll("#main tbody tr")]; }

function move(step) {
  const all = rows();
  if (!all.length) return;
  state.cursor = Math.max(0, Math.min(all.length - 1, state.cursor + step));
  all.forEach((r, i) => r.setAttribute("aria-selected", String(i === state.cursor)));
  all[state.cursor].focus();
}

function open() {
  const row = rows()[state.cursor];
  if (!row?.dataset.product) return;
  state.detail = row.dataset.product;
  state.cursor = 0;
  render();
}

let renderSeq = 0;
const current = (seq) => seq === renderSeq;

async function render() {
  const seq = ++renderSeq;
  document.querySelectorAll("nav button").forEach((b) =>
    b.setAttribute("aria-current", String(b.dataset.view === state.view && !state.detail)));

  const main = el("main");
  main.innerHTML = "";
  if (state.detail) return renderProduct(main, state.detail, seq);
  if (state.view === "products") return renderProducts(main, seq);
  if (state.view === "work") return renderWork(main, seq);
  if (state.view === "flow") return renderFlow(main, seq);
  if (state.view === "conformance") return renderConformance(main, seq);
}

function fail(main, res) {
  main.innerHTML = `<p class="err">${escape(res.body?.error ?? res.text)}</p>`;
}

function table(main, headers, entries) {
  const t = document.createElement("table");
  t.innerHTML = "<thead><tr>" + headers.map((h) => `<th>${h}</th>`).join("") + "</tr></thead>";
  const body = document.createElement("tbody");
  entries.forEach((row, i) => {
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    if (row.product) tr.dataset.product = row.product;
    tr.setAttribute("aria-selected", String(i === state.cursor));
    tr.innerHTML = row.html;
    // Click selects, a second click opens. The same actions the keyboard runs, not a
    // parallel implementation of them.
    tr.addEventListener("click", () => { state.cursor = i; move(0); });
    tr.addEventListener("dblclick", open);
    body.append(tr);
  });
  t.append(body);
  const surface = document.createElement("div");
  surface.className = "surface";
  surface.append(t);
  main.append(surface);
  rows()[state.cursor]?.focus();
}

async function renderProducts(main, seq) {
  const res = await api("/products");
  if (!current(seq)) return;
  if (!res.ok) return fail(main, res);

  const products = res.body.products ?? [];
  el("derived").textContent =
    `derived from ${products.length} repositor${products.length === 1 ? "y" : "ies"} · read ${ago(res.body.refreshed_at)}`;

  if (!products.length) {
    main.innerHTML = `<div class="blank"><h3>No products found</h3>
      <p>A product is any repository containing <code>specs/increment-plan.md</code>.<br>
      Start canon with <code>-products &lt;directory&gt;</code>.</p></div>`;
    return;
  }
  table(main, ["Product", "Open", "Done", "Health", "Read"], products.map((p) => ({
    product: p.name,
    html: p.error
      ? `<td class="title">${escape(p.name)}</td><td colspan="3" class="muted">${escape(p.error)}</td>` +
        `<td class="muted">${ago(p.refreshed_at)}</td>`
      : `<td class="title">${escape(p.name)}<div class="muted">${escape((p.purpose ?? "").slice(0, 90))}</div></td>` +
        `<td>${p.open}</td><td>${p.done}</td>` +
        `<td>${p.conforms ? '<span class="state open">conforms</span>'
                          : '<span class="state active">' + p.findings + ' finding(s)</span>'}</td>` +
        `<td class="muted">${ago(p.refreshed_at)}</td>`,
  })));
}

async function renderWork(main, seq) {
  const q = new URLSearchParams();
  if (state.status) q.set("status", state.status);
  if (state.blocked) q.set("blocked", "true");
  q.set("limit", state.limit);
  q.set("offset", state.offset);
  const res = await api("/increments?" + q);
  if (!current(seq)) return;
  if (!res.ok) return fail(main, res);

  const bar = document.createElement("div");
  bar.className = "toolbar";
  bar.innerHTML =
    `<select id="q"><option value="">every status</option>` +
    ["planned", "approved", "in-progress", "in-review", "done", "abandoned"]
      .map((s) => `<option ${s === state.status ? "selected" : ""}>${s}</option>`).join("") +
    `</select>` +
    `<button class="btn" id="blocked" aria-pressed="${state.blocked}">Blocked only</button>` +
    `<span class="muted" id="count"></span>`;
  main.append(bar);
  el("q").addEventListener("change", (e) => { state.status = e.target.value; state.offset = 0; render(); });
  el("blocked").addEventListener("click", () => { state.blocked = !state.blocked; state.offset = 0; render(); });

  const total = res.body.total ?? 0;
  const shown = res.body.increments?.length ?? 0;
  el("count").textContent = shown ? `${state.offset + 1}–${state.offset + shown} of ${total}` : `0 of ${total}`;
  el("derived").textContent = `read ${ago(res.body.refreshed_at)}`;

  if (!shown) {
    main.append(Object.assign(document.createElement("div"),
      { className: "blank", innerHTML: "<h3>Nothing matches</h3>" }));
    return;
  }
  table(main, ["Product", "", "Title", "Status", "Waiting on"], res.body.increments.map((i) => ({
    product: i.product,
    html: `<td class="muted">${escape(i.product)}</td><td class="id">${escape(i.id)}</td>` +
          `<td class="title">${escape(i.title)}</td>` +
          `<td><span class="state ${categoryOf(i.status)}">${escape(i.status)}</span></td>` +
          `<td class="id">${(i.blocked_by ?? []).map(escape).join(", ")}</td>`,
  })));

  const pager = document.createElement("div");
  pager.className = "toolbar";
  pager.style.marginTop = "1rem";
  pager.innerHTML =
    `<button class="btn" id="prev" ${state.offset === 0 ? "disabled" : ""}>Previous</button>` +
    `<button class="btn" id="next" ${state.offset + shown >= total ? "disabled" : ""}>Next</button>`;
  main.append(pager);
  el("prev").addEventListener("click", () => { state.offset = Math.max(0, state.offset - state.limit); render(); });
  el("next").addEventListener("click", () => { state.offset += state.limit; render(); });
}

const card = (k, v, small) =>
  `<div class="card"><dt>${k}</dt><dd${small ? ' class="small"' : ""}>${v}</dd></div>`;

async function renderFlow(main, seq) {
  const res = await api("/metrics?days=30");
  if (!current(seq)) return;
  if (!res.ok) return fail(main, res);
  const f = res.body;

  const spread = (s) => s.count
    ? `p50 ${duration(s.p50_days)} · p85 ${duration(s.p85_days)} · p95 ${duration(s.p95_days)} (n=${s.count})`
    : "nothing completed in the window";

  const cards = document.createElement("div");
  cards.className = "cards";
  cards.innerHTML =
    card("Completed (30d)", f.completed) +
    card("In progress", f.in_progress) +
    card("Cycle time", spread(f.cycle_time), true) +
    card("Lead time", spread(f.lead_time), true) +
    card("Ageing", (f.ageing ?? []).map((a) => `${a.id} ${duration(a.days)}`).join(" · ") || "nothing ageing", true);
  main.append(cards);

  main.append(Object.assign(document.createElement("p"), {
    className: "hint",
    textContent: "Measured from status changes recorded in each repository's ledger. Canon has no estimates.",
  }));
}

async function renderConformance(main, seq) {
  const res = await api("/conformance");
  if (!current(seq)) return;
  if (!res.ok) return fail(main, res);

  for (const p of res.body.products ?? []) {
    const section = document.createElement("section");
    section.innerHTML = `<h3>${escape(p.product)}</h3>`;
    const surface = document.createElement("div");
    surface.className = "surface";
    const findings = p.findings ?? [];
    if (p.error) {
      surface.innerHTML = `<div class="finding"><span class="sev error">unreadable</span><span>${escape(p.error)}</span></div>`;
    } else if (!findings.length) {
      surface.innerHTML = `<div class="finding"><span class="sev ok">ok</span><span class="muted">conforms — nothing to report</span></div>`;
    } else {
      surface.innerHTML = findings.map((f) =>
        `<div class="finding"><span class="sev ${escape(f.severity)}">${escape(f.severity)}</span>` +
        `<span>${f.subject ? `<span class="id">${escape(f.subject)}</span> ` : ""}${escape(f.message)}</span></div>`
      ).join("");
    }
    section.append(surface);
    main.append(section);
  }

  main.append(Object.assign(document.createElement("p"), {
    className: "hint",
    textContent: "Reported, never enforced — refusing a commit is each repository's own job, in its hook and its CI.",
  }));
}

async function renderProduct(main, name, seq) {
  const res = await api("/products/" + encodeURIComponent(name));
  if (!current(seq)) return;
  if (!res.ok) return fail(main, res);
  const e = res.body;
  const repo = e.repository;

  const head = document.createElement("div");
  head.innerHTML = `<h2>${escape(name)}</h2>` +
    (repo?.purpose ? `<p class="muted">${escape(repo.purpose)}</p>` : "") +
    (repo?.remote ? `<p class="hint">${escape(repo.remote)} · ${escape(String(repo.head ?? "").slice(0, 7))} · read ${ago(e.refreshed_at)}</p>` : "");
  main.append(head);

  if (e.error) {
    main.append(Object.assign(document.createElement("p"), { className: "err", textContent: e.error }));
    return;
  }
  for (const cycle of e.cycles ?? []) {
    main.append(Object.assign(document.createElement("p"), {
      className: "err",
      textContent: `Dependency cycle: ${cycle.join(" → ")} → ${cycle[0]}. Nothing in it can start ` +
                   `until one dependency is removed.`,
    }));
  }
  const blocked = e.blocked ?? {};
  table(main, ["", "Title", "Status", "Waiting on"], (repo.increments ?? []).map((i) => ({
    html: `<td class="id">${escape(i.id)}</td><td class="title">${escape(i.title)}</td>` +
          `<td><span class="state ${categoryOf(i.status)}">${escape(i.status)}</span></td>` +
          `<td class="id">${(blocked[i.id] ?? []).map(escape).join(", ")}</td>`,
  })));
  main.append(Object.assign(document.createElement("p"), {
    className: "hint",
    textContent: "Esc back · j and k move · every status change came from a commit to this repository's ledger",
  }));
}

// Keyboard dispatch. Chords like "g p" wait briefly for their second key.
let pending = "";
document.addEventListener("keydown", (ev) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(ev.target.tagName) && ev.key !== "Escape") return;
  const combo = pending ? pending + " " + ev.key : ev.key;
  const action = ACTIONS.find((a) => a.key === combo);
  if (action) {
    ev.preventDefault();
    pending = "";
    return action.run();
  }
  if (ACTIONS.some((a) => a.key.startsWith(ev.key + " "))) {
    pending = ev.key;
    setTimeout(() => { pending = ""; }, 900);
    return;
  }
  pending = "";
});

document.querySelectorAll("nav button").forEach((b) =>
  b.addEventListener("click", () => go(b.dataset.view)));

// The keyboard reference is generated from the registry, so it cannot drift from what
// the keys actually do.
const help = document.createElement("dialog");
help.id = "help";
help.innerHTML = `<div style="padding:1rem;min-width:22rem">
  <b>Keyboard</b>
  <table style="margin-top:.5rem"><tbody>` +
  ACTIONS.map((a) => `<tr><td><kbd>${escape(a.key)}</kbd></td><td>${escape(a.name)}</td></tr>`).join("") +
  `</tbody></table><p class="hint"><kbd>Esc</kbd> close</p></div>`;
document.body.append(help);

say("? for keyboard help · Canon shows what it read; it accepts no writes");
render();
</script>
