<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canon</title>
<style>
  /* Primer-ish. GitHub's palette and conventions, because a tracker is not the place
     to teach somebody a new visual language: every developer already knows what a grey
     bordered surface with a 6px radius and a coloured state pill means here.

     Copied by eye rather than by importing Primer — one embedded file with no external
     requests is a property the product claims, and a CSS dependency would end it. */
  :root {
    --bg: #ffffff; --bg-inset: #f6f8fa; --bg-hover: #f6f8fa;
    --fg: #1f2328; --dim: #59636e; --faint: #818b98;
    --line: #d1d9e0; --line-soft: #d1d9e0b3;
    --accent: #0969da; --accent-bg: #ddf4ff;
    --open: #1a7f37; --open-bg: #dafbe1;
    --active: #9a6700; --active-bg: #fff8c5;
    --closed: #8250df; --closed-bg: #fbefff;
    --warn: #bc4c00; --warn-bg: #fff1e5;
    --danger: #d1242f;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 0 rgba(31,35,40,.04);
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --bg-inset:#151b23; --bg-hover:#151b23;
      --fg:#f0f6fc; --dim:#9198a1; --faint:#6b7280;
      --line:#3d444d; --line-soft:#3d444db3;
      --accent:#4493f8; --accent-bg:#121d2f;
      --open:#3fb950; --open-bg:#0f2417;
      --active:#d29922; --active-bg:#2b2410;
      --closed:#ab7df8; --closed-bg:#221033;
      --warn:#db6d28; --warn-bg:#2b1a0f;
      --danger:#f85149;
      --shadow:0 1px 0 rgba(1,4,9,.2);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
              Helvetica, Arial, sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  header { display:flex; align-items:center; gap:1rem; padding:.75rem 1.5rem;
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;
           background:var(--bg-inset); }
  header b { font-size:1rem; font-weight:600; letter-spacing:-.01em; }
  header .who { color:var(--dim); font-size:12px; }
  nav { margin-left:auto; display:flex; gap:.25rem; }
  nav button { background:none; border:1px solid transparent; color:var(--fg);
               cursor:pointer; font:inherit; padding:.3rem .6rem;
               border-radius:var(--radius); display:flex; align-items:center; gap:.4rem; }
  nav button:hover { background:var(--bg-hover); border-color:var(--line-soft); }
  nav button[aria-current="true"] { font-weight:600; background:var(--bg);
                                    border-color:var(--line); box-shadow:var(--shadow); }
  main { padding:1.5rem; max-width:76rem; margin:0 auto; }

  /* A bordered surface is GitHub's fundamental unit: the list, the panel, the box. */
  .surface { border:1px solid var(--line); border-radius:var(--radius);
             background:var(--bg); overflow:hidden; }
  .surface > .surface-head { background:var(--bg-inset); padding:.6rem .9rem;
                             border-bottom:1px solid var(--line); font-size:13px;
                             color:var(--dim); display:flex; align-items:center; gap:.6rem; }

  table { border-collapse:collapse; width:100%; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:12px;
       padding:.5rem .9rem; background:var(--bg-inset);
       border-bottom:1px solid var(--line); }
  td { padding:.6rem .9rem; border-top:1px solid var(--line-soft); }
  tbody tr:first-child td { border-top:none; }
  tbody tr:hover td { background:var(--bg-hover); }
  tbody tr { cursor:pointer; }
  tr[aria-selected="true"] td { background:var(--accent-bg); }
  tr:focus { outline:2px solid var(--accent); outline-offset:-2px; }
  td.title { font-weight:600; }
  .id { font-family:var(--mono); color:var(--dim); white-space:nowrap; font-size:12px; }

  /* State pills, the way an issue's status reads on GitHub. */
  .state { font-size:12px; font-weight:500; padding:.1rem .6rem; border-radius:2rem;
           border:1px solid transparent; white-space:nowrap; display:inline-block; }
  .state.open   { color:var(--open);   background:var(--open-bg);   border-color:var(--open); }
  .state.active { color:var(--active); background:var(--active-bg); border-color:var(--active); }
  .state.closed { color:var(--closed); background:var(--closed-bg); border-color:var(--closed); }

  .btn { font:inherit; font-size:13px; padding:.3rem .75rem; border-radius:var(--radius);
         border:1px solid var(--line); background:var(--bg-inset); color:var(--fg);
         cursor:pointer; box-shadow:var(--shadow); display:inline-flex;
         align-items:center; gap:.4rem; }
  .btn:hover { background:var(--bg-hover); border-color:var(--dim); }
  .btn:disabled { color:var(--faint); cursor:default; background:var(--bg-inset);
                  border-color:var(--line-soft); }
  .btn:disabled:hover { border-color:var(--line-soft); }
  .btn.primary { background:var(--open); border-color:var(--open); color:#fff; font-weight:500; }
  .btn.primary:hover { filter:brightness(1.08); border-color:var(--open); }
  .btn-row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }

  .toolbar { display:flex; gap:.5rem; align-items:center; margin-bottom:1rem;
             flex-wrap:wrap; }
  .toolbar input[type="search"] { flex:1; min-width:14rem; }

  .cols { display:flex; gap:1rem; overflow-x:auto; align-items:flex-start; }
  .col { min-width:16rem; flex:1; border:1px solid var(--line);
         border-radius:var(--radius); background:var(--bg); }
  .col h3 { margin:0; padding:.6rem .8rem; font-size:12px; font-weight:600;
            color:var(--dim); border-bottom:1px solid var(--line);
            background:var(--bg-inset); }
  .col ul { list-style:none; margin:0; padding:.5rem; }
  .col li { padding:.4rem .5rem; border-radius:var(--radius); }
  .col li:hover { background:var(--bg-hover); }

  dialog { border:1px solid var(--line); border-radius:var(--radius); background:var(--bg);
           color:var(--fg); padding:0; min-width:26rem; box-shadow:0 8px 24px rgba(31,35,40,.2); }
  dialog form { padding:1rem; }
  dialog label { display:block; font-weight:600; margin-bottom:.5rem; }
  dialog::backdrop { background:rgba(31,35,40,.4); }

  input, select { font:inherit; padding:.4rem .7rem; border:1px solid var(--line);
                  border-radius:var(--radius); background:var(--bg); color:var(--fg);
                  width:100%; }
  input:focus, select:focus { outline:none; border-color:var(--accent);
                              box-shadow:0 0 0 3px var(--accent-bg); }
  kbd { font-family:var(--mono); font-size:11px; border:1px solid var(--line);
        border-bottom-width:2px; border-radius:var(--radius); padding:.05rem .35rem;
        color:var(--dim); background:var(--bg-inset); }

  .hint { color:var(--dim); font-size:12px; margin-top:.5rem; }
  .err { color:var(--danger); font-size:13px; white-space:pre-wrap;
         border:1px solid var(--danger); background:var(--warn-bg);
         border-radius:var(--radius); padding:.6rem .8rem; }

  .metrics { display:grid; grid-template-columns:repeat(auto-fit, minmax(14rem,1fr));
             gap:1rem; }
  .metrics .card { border:1px solid var(--line); border-radius:var(--radius);
                   padding:.9rem 1rem; background:var(--bg); }
  .metrics dt { color:var(--dim); font-size:12px; margin-bottom:.2rem; }
  .metrics dd { margin:0; font-size:1.4rem; font-weight:600; letter-spacing:-.02em; }
  .metrics dd.small { font-size:13px; font-weight:400; font-family:var(--mono);
                      color:var(--fg); }

  .detail { max-width:56rem; }
  .detail h2 { margin:.2rem 0 .5rem; font-size:1.5rem; font-weight:600;
               letter-spacing:-.02em; }
  .detail .crumbs { color:var(--dim); font-size:12px; margin-bottom:.4rem; }
  .detail section { border-top:1px solid var(--line); padding:.9rem 0; }
  .detail h4 { margin:0 0 .5rem; font-size:12px; color:var(--dim); font-weight:600; }
  .detail dl { display:grid; grid-template-columns:9rem 1fr; gap:.3rem .8rem; margin:0; }
  .detail dt { color:var(--dim); font-size:13px; }
  .detail dd { margin:0; }

  .rel { list-style:none; margin:0; padding:0; }
  .rel li { padding:.3rem .5rem; border-radius:var(--radius); }
  .rel li[tabindex] { cursor:pointer; }
  .rel li[tabindex]:hover { background:var(--bg-hover); }
  .rel li[tabindex]:focus { outline:2px solid var(--accent); outline-offset:-2px; }

  .check { list-style:none; margin:0; padding:0; }
  .check li { display:flex; gap:.6rem; align-items:baseline; padding:.35rem .5rem;
              border-radius:var(--radius); cursor:pointer; }
  .check li:hover { background:var(--bg-hover); }
  .check li[tabindex]:focus { outline:2px solid var(--accent); outline-offset:-2px; }
  .check .box { font-family:var(--mono); color:var(--dim); }
  .check li.met .box { color:var(--open); }
  .check li.met .text { color:var(--dim); text-decoration:line-through; }
  .check .who { color:var(--dim); font-size:11px; margin-left:auto; }
  .progress { font-size:12px; color:var(--dim); }
  .progress.blocking { color:var(--warn); font-weight:500; }

  .tags { display:flex; gap:.35rem; flex-wrap:wrap; }
  .tag { font-size:12px; border:1px solid var(--line); border-radius:2rem;
         padding:.05rem .6rem; color:var(--dim); background:var(--bg-inset); }

  /* GitHub's flash: a coloured left edge on a tinted surface. */
  .banner { border:1px solid var(--warn); border-left-width:4px; background:var(--warn-bg);
            padding:.6rem .8rem; margin:.5rem 0; border-radius:var(--radius);
            font-size:13px; }
  .banner b { color:var(--warn); }

  .blank { text-align:center; padding:3rem 1rem; color:var(--dim); }
  .blank h3 { margin:0 0 .4rem; color:var(--fg); font-size:1rem; }

  #status { position:fixed; bottom:0; left:0; right:0; padding:.5rem 1.5rem;
            border-top:1px solid var(--line); background:var(--bg-inset);
            font-size:12px; color:var(--dim); }
</style>

<header>
  <b>Canon</b>
  <span class="who" id="who"></span>
  <nav>
    <button data-view="issues" data-key="g i">Issues <kbd>g i</kbd></button>
    <button data-view="boards" data-key="g b">Boards <kbd>g b</kbd></button>
    <button data-view="metrics" data-key="g m">Flow <kbd>g m</kbd></button>
    <button data-view="proposals" data-key="g p">Proposals <kbd>g p</kbd></button>
  </nav>
</header>

<main id="main" aria-live="polite"></main>
<div id="status"></div>

<dialog id="create">
  <form method="dialog" id="create-form">
    <label for="title">New issue</label>
    <input id="title" name="title" autocomplete="off" placeholder="Title, and nothing else">
    <p class="hint"><kbd>Enter</kbd> create · <kbd>Esc</kbd> cancel</p>
  </form>
</dialog>

<dialog id="prompt">
  <form method="dialog" id="prompt-form">
    <label id="prompt-label" for="prompt-input"></label>
    <input id="prompt-input" autocomplete="off">
    <p class="hint" id="prompt-hint"></p>
  </form>
</dialog>

<dialog id="help">
  <h3 style="margin-top:0">Keyboard</h3>
  <table id="help-table" role="presentation"></table>
  <p class="hint"><kbd>Esc</kbd> close</p>
</dialog>

<script type="module">
// Canon's UI is keyboard-first. Every action lives in this one registry: the help
// dialog is generated from it, and a test asserts that no action exists outside it.
// A pointer-only affordance would be a bug, not a gap.
const params = new URLSearchParams(location.search);
const actor = params.get("actor") || "you";

// A token may be supplied as ?token=. It is kept in memory and stripped from the
// address bar immediately, so it does not sit in the browser's history or get pasted
// into a chat window along with the URL. It still reached the server in a query
// string on the way here, which is the honest weakness of this approach — see
// bearer() in internal/api. A cookie and a session layer would be better and are a
// larger thing than this tracker wants to be.
const token = params.get("token") || "";
if (token) {
  params.delete("token");
  const clean = params.toString();
  history.replaceState(null, "", location.pathname + (clean ? "?" + clean : ""));
}
const api = async (method, path, body) => {
  const res = await fetch("/api" + path, {
    method,
    headers: {
      "X-Canon-Actor": actor,
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
    },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let parsed = null;
  try { parsed = text ? JSON.parse(text) : null; } catch { /* not json */ }
  return { ok: res.ok, status: res.status, body: parsed, text };
};

const state = { view: "issues", issues: [], cursor: 0, schema: null, boards: [], board: null };
const el = (id) => document.getElementById(id);
const say = (msg, isError) => {
  const bar = el("status");
  bar.textContent = msg;
  bar.className = isError ? "err" : "";
};

// ---- actions ------------------------------------------------------------
// key: the binding. Every one is reachable without a pointer.
const ACTIONS = [
  { key: "?",     name: "Keyboard help",        run: () => el("help").showModal() },
  { key: "c",     name: "Create issue",         run: openCreate },
  { key: "j",     name: "Next issue",           run: () => move(1) },
  { key: "k",     name: "Previous issue",       run: () => move(-1) },
  { key: "Enter", name: "Open selected",        run: openSelected },
  { key: "Escape", name: "Back to the list",    run: closeDetail },
  { key: "p",     name: "Set parent",           run: promptParent },
  { key: "d",     name: "Add a dependency",     run: promptDependency },
  { key: " ",     name: "Tick or untick an item", run: toggleChecklistItem },
  { key: "n",     name: "Add a checklist item",  run: promptChecklistItem },
  { key: "t",     name: "Transition selected",  run: promptTransition },
  { key: "/",     name: "Search or filter",     run: promptQuery },
  { key: "r",     name: "Reload",               run: render },
  { key: "g i",   name: "Go to issues",         run: () => go("issues") },
  { key: "g b",   name: "Go to boards",         run: () => go("boards") },
  { key: "g m",   name: "Go to flow",           run: () => go("metrics") },
  { key: "g p",   name: "Go to proposals",      run: () => go("proposals") },
  { key: "a",     name: "Approve proposal",     run: decideProposal.bind(null, "approve") },
  { key: "x",     name: "Reject proposal",      run: decideProposal.bind(null, "reject") },
];

function go(view) {
  state.view = view;
  state.detail = null;
  state.cursor = 0;
  render();
}

function move(delta) {
  // Scoped to #main on purpose: an unscoped "tbody tr" also matches the help
  // dialog's rows, and j/k would walk through the keyboard reference.
  const rows = document.querySelectorAll("#main tbody tr, #main .col li, #main .rel li, #main .check li");
  if (!rows.length) return;
  state.cursor = Math.max(0, Math.min(rows.length - 1, state.cursor + delta));
  rows.forEach((r, i) => r.setAttribute("aria-selected", String(i === state.cursor)));
  rows[state.cursor].focus();
  rows[state.cursor].scrollIntoView({ block: "nearest" });
}

function selectedId() {
  const row = document.querySelector('#main [aria-selected="true"]');
  return row ? row.dataset.id : null;
}

// Opening an issue is a view, not a modal: relationships are the point of this
// screen, and you navigate between issues by pressing Enter on one of them. A dialog
// would make "follow this dependency" mean closing and reopening.
function openSelected() {
  const id = selectedId();
  if (!id) return say("nothing selected", true);
  state.detail = id;
  state.cursor = 0;
  render();
}

function closeDetail() {
  if (!state.detail) return;
  state.detail = null;
  state.cursor = 0;
  render();
}

// A dialog opened by keyboard must be ready to type into, or the shortcut has only
// moved the work rather than removed it.
function openCreate() {
  const dialog = el("create");
  el("title").value = "";
  dialog.showModal();
  el("title").focus();
}

el("create-form").addEventListener("submit", async () => {
  const title = el("title").value.trim();
  if (!title) return;
  const res = await api("POST", "/issues", { title });
  if (!res.ok) return say(res.body?.error ?? res.text, true);
  say("created " + res.body.id);
  render();
});

function ask(label, hint, onSubmit) {
  el("prompt-label").textContent = label;
  el("prompt-hint").textContent = hint;
  el("prompt-input").value = "";
  el("prompt").showModal();
  el("prompt-input").focus();
  el("prompt-form").onsubmit = () => onSubmit(el("prompt-input").value.trim());
}

function promptQuery() {
  ask("Search", "a word searches · team=platform priority=p1 filters · Esc cancels", async (q) => {
    state.query = q;
    render();
  });
}

function promptTransition() {
  const id = state.detail ?? selectedId();
  if (!id) return say("nothing selected", true);
  const issue = state.detail ? state.detailData?.issue : state.issues.find((i) => i.id === id);
  const to = (state.schema?.states ?? []).find((s) => s.name === issue?.state)?.to ?? [];
  ask("Move " + id, to.length ? "to: " + to.join(", ") : "no transitions from here",
    async (target) => {
      if (!target) return;
      const res = await api("POST", `/issues/${id}/transition`, { to: target });
      if (res.status === 202) {
        say(`proposal ${res.body.proposal_id}: ${res.body.operation} — awaiting a human`);
      } else if (!res.ok) {
        say(res.body?.error ?? res.text, true);
      } else {
        say(`${id} → ${target}`);
      }
      render();
    });
}

function promptParent() {
  const id = state.detail ?? selectedId();
  if (!id) return say("nothing selected", true);
  const issue = state.detailData?.issue ?? state.issues.find((i) => i.id === id);
  const allowed = state.schema?.parent_types?.[issue?.type] ?? [];
  ask("Parent of " + id,
    allowed.length ? "must be " + allowed.join(" or ") + " · blank to clear" : "this type has no permitted parent",
    async (parent) => {
      const res = await api("PUT", `/issues/${id}/parent`, { parent });
      if (!res.ok) return say(res.body?.error ?? res.text, true);
      say(parent ? `${id} now sits under ${parent}` : `${id} has no parent`);
      render();
    });
}

function promptDependency() {
  const id = state.detail ?? selectedId();
  if (!id) return say("nothing selected", true);
  ask("What does " + id + " wait on?", "an issue id · cycles are allowed and warned about",
    async (on) => {
      if (!on) return;
      const res = await api("PUT", `/issues/${id}/dependencies`, { on });
      if (!res.ok) return say(res.body?.error ?? res.text, true);
      say(res.body?.warning ?? `${id} now waits on ${on}`, Boolean(res.body?.warning));
      render();
    });
}

// Toggling is the one write this screen exists to make easy: a criterion is met or
// it is not, and saying so should cost one keystroke.
async function toggleChecklistItem() {
  const row = document.querySelector('#main .check li[aria-selected="true"]');
  if (!row) return say("select a checklist item first", true);
  const res = await api("PUT", `/issues/${state.detail}/checklist/${row.dataset.field}`,
    { text: row.dataset.text, checked: row.dataset.checked !== "true" });
  if (!res.ok) return say(res.body?.error ?? res.text, true);
  say(`${row.dataset.checked === "true" ? "unticked" : "met"}: ${row.dataset.text}`);
  render();
}

function promptChecklistItem() {
  const id = state.detail;
  if (!id) return say("open an issue first", true);
  const fields = Object.keys(state.detailData?.issue?.checklists ?? {});
  const field = fields[0] ?? checklistFieldFor(state.detailData?.issue);
  if (!field) return say("this issue type has no checklist field", true);
  ask(`Add to ${field}`, "one criterion · EARS reads well here", async (text) => {
    if (!text) return;
    const res = await api("PUT", `/issues/${id}/checklist/${field}`, { text });
    if (!res.ok) return say(res.body?.error ?? res.text, true);
    say("added: " + text);
    render();
  });
}

// An issue with an empty checklist has no key in Checklists yet, so fall back to
// whatever checklist field its type declares.
function checklistFieldFor(issue) {
  if (!issue) return null;
  const type = (state.schema?.issue_types ?? []).find((t) => t.name === issue.type);
  const checklists = (state.schema?.fields ?? [])
    .filter((f) => f.type === "checklist").map((f) => f.name);
  return (type?.fields ?? []).find((f) => checklists.includes(f)) ?? null;
}

async function decideProposal(decision) {
  if (state.view !== "proposals") return say("go to proposals first (g p)", true);
  const id = selectedId();
  if (!id) return say("nothing selected", true);
  const res = await api("POST", `/proposals/${id}/${decision}`, {});
  if (!res.ok) return say(res.body?.error ?? res.text, true);
  say(`${id} ${decision}d`);
  render();
}

// ---- rendering ----------------------------------------------------------
const categoryOf = (name) =>
  (state.schema?.states ?? []).find((s) => s.name === name)?.category ?? "";

// Every view fetches before it paints, so two navigations in quick succession leave
// two renders in flight and the screen shows whichever one's request happened to
// return last. Pressing Escape then g m could land on the issue list under a
// highlighted Flow tab — not a stale frame, a wrong one, and non-deterministically so.
//
// Each render takes a ticket. A render whose ticket is no longer the current one has
// been superseded and must not write. This is the same discipline the status bar
// needed, arrived at the same way: by watching it lose.
let renderSeq = 0;

// current reports whether the render holding this ticket is still the one on screen.
function current(seq) {
  return seq === renderSeq;
}

async function render() {
  const seq = ++renderSeq;
  el("who").textContent = actor;
  document.querySelectorAll("nav button").forEach((b) =>
    b.setAttribute("aria-current", String(b.dataset.view === state.view)));

  if (!state.schema) {
    const res = await api("GET", "/schema");
    if (res.ok) state.schema = res.body;
  }
  if (!current(seq)) return;
  const main = el("main");
  main.innerHTML = "";

  if (state.detail) return renderDetail(main, state.detail, seq);
  if (state.view === "issues") return renderIssues(main, seq);
  if (state.view === "boards") return renderBoards(main, seq);
  if (state.view === "metrics") return renderMetrics(main, seq);
  if (state.view === "proposals") return renderProposals(main, seq);
}

function table(main, headers, rows) {
  const t = document.createElement("table");
  t.innerHTML = "<thead><tr>" + headers.map((h) => `<th>${h}</th>`).join("") + "</tr></thead>";
  const body = document.createElement("tbody");
  rows.forEach((cells, i) => {
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    tr.dataset.id = cells.id;
    tr.setAttribute("aria-selected", String(i === state.cursor));
    tr.innerHTML = cells.html;
    body.append(tr);
  });
  t.append(body);
  const surface = document.createElement("div");
  surface.className = "surface";
  surface.append(t);
  main.append(surface);
  const rowEls = body.querySelectorAll("tr");
  if (rowEls[state.cursor]) rowEls[state.cursor].focus();
}

async function renderIssues(main, seq) {
  const q = state.query ? "?q=" + encodeURIComponent(state.query) : "";
  const res = await api("GET", "/issues" + q);
  if (!current(seq)) return;
  if (!res.ok) {
    main.innerHTML = `<p class="err">${res.body?.error ?? res.text}</p>`;
    return;
  }
  state.issues = res.body.issues ?? [];

  // Lists are bounded server-side, so say what is being shown. This goes in the
  // main region, not the status bar: the status bar reports the last action, and
  // writing a list summary there wiped the refusal an action had just reported.
  const total = res.body.total ?? state.issues.length;
  const shown = state.issues.length;
  const scope = state.query ? ` matching ${escape(state.query)}` : "";
  const caption = document.createElement("p");
  caption.className = "hint";
  caption.id = "list-summary";
  caption.textContent = shown < total
    ? `showing ${shown} of ${total}${scope} — narrow it with /`
    : `${total} issue${total === 1 ? "" : "s"}${scope}`;
  main.append(caption);
  if (!state.issues.length) {
    const blank = document.createElement("div");
    blank.className = "blank";
    blank.innerHTML = state.query
      ? `<h3>Nothing matches</h3><p>No issue matches <b>${escape(state.query)}</b>.</p>`
      : `<h3>No issues yet</h3><p>Create the first one.</p>`;
    main.append(blank);
    return;
  }
  table(main, ["", "Title", "State", "Team"], state.issues.map((i) => ({
    id: i.id,
    html: `<td class="id">${i.id}</td><td class="title">${escape(i.title)}</td>` +
          `<td><span class="state ${categoryOf(i.state)}">${escape(i.state)}</span></td>` +
          `<td>${escape(i.team ?? "")}</td>`,
  })));
}

// renderDetail is the one screen where the relationships built over four increments
// become visible: where an issue sits in the hierarchy, what it waits on, what waits
// on it, and whether any of that is stopping it.
async function renderDetail(main, id, seq) {
  const [issue, ancestors, children, dependencies] = await Promise.all([
    api("GET", `/issues/${id}`),
    api("GET", `/issues/${id}/ancestors`),
    api("GET", `/issues/${id}/children`),
    api("GET", `/issues/${id}/dependencies`),
  ]);
  if (!current(seq)) return;
  if (!issue.ok) {
    main.innerHTML = `<p class="err">${escape(issue.body?.error ?? issue.text)}</p>`;
    return;
  }
  const d = issue.body;
  state.detailData = { issue: d, dependencies: dependencies.body };

  const wrap = document.createElement("div");
  wrap.className = "detail";

  // Breadcrumb: the chain reads root-first, which is how people say it aloud.
  const chain = (ancestors.body?.ancestors ?? []).slice().reverse();
  wrap.innerHTML =
    `<p class="crumbs">${chain.length ? chain.map(escape).join(" › ") + " › " : ""}<b>${escape(d.id)}</b></p>` +
    `<h2>${escape(d.title)}</h2>`;

  const deps = dependencies.body ?? {};
  // Blocking and cycles are stated before anything else. They are the reason the
  // work is not moving, and burying them under field values would be a strange
  // choice for a screen someone opened to find out why.
  if (deps.blocked) {
    wrap.innerHTML += `<div class="banner"><b>Blocked</b> — waiting on ` +
      (deps.blocked_by ?? []).map(escape).join(", ") + `</div>`;
  }
  for (const cycle of deps.cycles ?? []) {
    wrap.innerHTML += `<div class="banner cycle"><b>Dependency cycle</b> — ` +
      cycle.map(escape).join(" → ") + ` → ${escape(cycle[0])}. ` +
      `Nothing in this cycle can start until one of these dependencies is removed.</div>`;
  }

  const section = (title, html) => {
    const el = document.createElement("section");
    el.innerHTML = `<h4>${title}</h4>${html}`;
    wrap.append(el);
    return el;
  };

  const fields = Object.entries(d.fields ?? {}).filter(([, v]) => v !== "");
  section("Detail",
    `<dl>` +
    `<dt>Type</dt><dd>${escape(d.type || "—")}</dd>` +
    `<dt>State</dt><dd class="state ${categoryOf(d.state)}">${escape(d.state)}</dd>` +
    `<dt>Team</dt><dd>${escape(d.team || "—")}</dd>` +
    `<dt>Last touched</dt><dd>${escape(d.last_actor?.id ?? "—")}` +
      (d.last_actor?.Model ? ` <span class="id">(${escape(d.last_actor.Model)})</span>` : "") + `</dd>` +
    fields.map(([k, v]) => `<dt>${escape(k)}</dt><dd>${escape(v)}</dd>`).join("") +
    `</dl>`);

  // Related issues are focusable list items so Enter navigates to them, which is
  // what makes this a graph you can walk rather than a page you read.
  const related = (label, ids, empty) => {
    if (!ids || ids.length === 0) {
      section(label, `<p class="hint">${empty}</p>`);
      return;
    }
    section(label, `<ul class="rel">` + ids.map((rid) =>
      `<li tabindex="0" data-id="${escape(rid)}"><span class="id">${escape(rid)}</span></li>`).join("") + `</ul>`);
  };

  // Checklists come before the relationships: they are the work itself, and on a
  // story with acceptance criteria they are what someone opened the issue to see.
  const blockingChecklists = new Set(
    ((state.schema?.states ?? []).find((st) => st.name === d.state)?.requires_checklist) ?? []);
  for (const [field, items] of Object.entries(d.checklists ?? {})) {
    const met = items.filter((i) => i.checked).length;
    const gate = (state.schema?.states ?? [])
      .filter((st) => (st.requires_checklist ?? []).includes(field))
      .map((st) => st.name);
    const cls = met < items.length && gate.length ? "progress blocking" : "progress";
    section(`${escape(field)} <span class="${cls}">${met} of ${items.length} met` +
      (gate.length && met < items.length ? ` · blocks ${gate.map(escape).join(", ")}` : "") + `</span>`,
      `<ul class="check">` + items.map((item) =>
        `<li tabindex="0" class="${item.checked ? "met" : ""}" data-field="${escape(field)}" ` +
        `data-text="${escape(item.text)}" data-checked="${item.checked}">` +
        `<span class="box">[${item.checked ? "x" : " "}]</span>` +
        `<span class="text">${escape(item.text)}</span>` +
        (item.checked_by ? `<span class="who">${escape(item.checked_by)}</span>` : "") +
        `</li>`).join("") + `</ul>`);
  }
  const emptyChecklist = checklistFieldFor(d);
  if (emptyChecklist && !(d.checklists ?? {})[emptyChecklist]) {
    section(escape(emptyChecklist), `<p class="hint">no criteria yet — <kbd>n</kbd> to add one</p>`);
  }

  for (const [field, values] of Object.entries(d.multi ?? {})) {
    if (!values.length) continue;
    section(escape(field),
      `<div class="tags">` + values.map((v) => `<span class="tag">${escape(v)}</span>`).join("") + `</div>`);
  }
  void blockingChecklists;

  related("Parent", d.parent ? [d.parent] : [], "no parent");
  related("Children", children.body?.children ?? [], "nothing beneath this");
  related("Waits on", deps.depends_on ?? [], "nothing");
  related("Waited on by", deps.dependents ?? [], "nothing");

  // Key hints live in the view, not the status bar. The status bar reports the last
  // action, and a re-render that writes a hint there wipes the refusal an action
  // just reported — the same bug feat-012 fixed for the issue list.
  const hints = document.createElement("p");
  hints.className = "hint";
  hints.id = "detail-hints";
  hints.innerHTML = `<kbd>Esc</kbd> back · <kbd>Space</kbd> tick · <kbd>n</kbd> new criterion ` +
    `· <kbd>p</kbd> parent · <kbd>d</kbd> dependency · <kbd>t</kbd> transition · <kbd>Enter</kbd> follow`;
  wrap.append(hints);

  main.append(wrap);

  const rows = main.querySelectorAll(".check li, .rel li");
  rows.forEach((r, i) => r.setAttribute("aria-selected", String(i === state.cursor)));
  if (rows[state.cursor]) rows[state.cursor].focus();
}

async function renderBoards(main, seq) {
  const list = await api("GET", "/boards");
  if (!current(seq)) return;
  if (!list.ok) return;
  state.boards = list.body.boards ?? [];
  if (!state.boards.length) {
    main.innerHTML = `<p class="hint">No boards yet. A board is a saved query and a grouping key.</p>`;
    return;
  }
  const name = state.board ?? state.boards[0].name;
  const res = await api("GET", "/boards/" + encodeURIComponent(name));
  if (!res.ok) {
    main.innerHTML = `<p class="err">${res.body?.error ?? res.text}</p>`;
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "cols";
  for (const col of res.body.columns ?? []) {
    const div = document.createElement("div");
    div.className = "col";
    div.innerHTML = `<h3>${col.name} · ${col.count}</h3><ul>` +
      col.issues.map((i) => `<li tabindex="0" data-id="${i.id}">` +
        `<span class="id">${i.id}</span> ${escape(i.title)}</li>`).join("") + "</ul>";
    wrap.append(div);
  }
  const caption = document.createElement("p");
  caption.className = "hint";
  caption.id = "board-summary";
  caption.textContent = `${name} — ${res.body.query || "everything"} grouped by ${res.body.group_by}`;
  main.append(caption);
  main.append(wrap);
}

async function renderMetrics(main, seq) {
  const res = await api("GET", "/metrics?days=30");
  if (!current(seq)) return;
  if (!res.ok) return;
  const f = res.body;
  const dl = document.createElement("dl");
  dl.className = "metrics";
  // Each number gets its own card, so the two that are counts read as big numbers
  // and the three that are distributions read as text. A single definition list made
  // "31" and "p50 11m · p85 1.2h · p95 9h" the same size, which is the wrong emphasis.
  const row = (k, v, small) =>
    `<div class="card"><dt>${k}</dt><dd${small ? ' class="small"' : ""}>${v}</dd></div>`;
  // Days are what the API reports; hours and minutes are what a reader can act on.
  // A team shipping in an afternoon should not be told its cycle time is 0d.
  const dur = (d) => {
    if (d >= 1) return `${Math.round(d * 10) / 10}d`;
    const hours = d * 24;
    if (hours >= 1) return `${Math.round(hours * 10) / 10}h`;
    const mins = Math.round(hours * 60);
    return mins > 0 ? `${mins}m` : "under a minute";
  };
  const pct = (s) => `p50 ${dur(s.p50_days)} · p85 ${dur(s.p85_days)} · p95 ${dur(s.p95_days)} (n=${s.count})`;
  dl.innerHTML =
    row("Completed (30d)", f.completed) +
    row("In progress", f.in_progress) +
    row("Cycle time", pct(f.cycle_time), true) +
    row("Lead time", pct(f.lead_time), true) +
    row("Ageing", (f.ageing ?? []).map((a) => `${a.id} ${dur(a.days)}`).join(" · ") || "nothing ageing", true);
  main.append(dl);
  const note = document.createElement("p");
  note.className = "hint";
  note.textContent = "Measured from recorded transitions. Canon has no estimates.";
  main.append(note);
}

async function renderProposals(main, seq) {
  const res = await api("GET", "/proposals");
  if (!current(seq)) return;
  if (!res.ok) return;
  const proposals = res.body.proposals ?? [];
  if (!proposals.length) {
    main.innerHTML = `<p class="hint">No proposals awaiting a decision.</p>`;
    return;
  }
  table(main, ["", "Operation", "On", "Proposed by"], proposals.map((p) => ({
    id: p.id,
    html: `<td class="id">${p.id}</td><td class="state">${p.Operation}</td>` +
          `<td class="id">${p.Subject}</td><td>${p.ProposedBy}${p.Model ? " (" + p.Model + ")" : ""}</td>`,
  })));
  const hints = document.createElement("p");
  hints.className = "hint";
  hints.id = "proposal-hints";
  hints.innerHTML = `<kbd>a</kbd> approve · <kbd>x</kbd> reject · <kbd>Enter</kbd> open the issue`;
  main.append(hints);
}

const escape = (s) => String(s ?? "").replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- key handling -------------------------------------------------------
let pending = "";
document.addEventListener("keydown", (e) => {
  const inField = ["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName);
  if (e.key === "Escape") {
    const open = document.querySelectorAll("dialog[open]");
    if (open.length) {
      open.forEach((d) => d.close());
      pending = "";
      return;
    }
    pending = "";
    closeDetail();
    return;
  }
  if (inField) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const combo = pending ? pending + " " + e.key : e.key;
  const action = ACTIONS.find((a) => a.key === combo);
  if (action) {
    e.preventDefault();
    pending = "";
    action.run();
    return;
  }
  // "g" opens a two-key sequence; anything else clears it.
  pending = ACTIONS.some((a) => a.key.startsWith(e.key + " ")) ? e.key : "";
});

document.querySelectorAll("nav button").forEach((b) =>
  b.addEventListener("click", () => go(b.dataset.view)));

el("help-table").innerHTML = ACTIONS
  .map((a) => `<tr><td><kbd>${a.key}</kbd></td><td>${a.name}</td></tr>`).join("");

window.CANON = { ACTIONS, state };
render();
say("? for keyboard help");
</script>
