name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "not gofmt-clean, run make fmt" >&2
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build

      # The self-host story depends on the binary having no dynamic dependencies,
      # so assert it rather than trusting CGO_ENABLED to stay set.
      - name: Assert the binary is static
        run: |
          file bin/canon
          if ldd bin/canon 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "binary is dynamically linked, CGO must stay disabled" >&2
            exit 1
          fi

  # Every action must work by keyboard and by pointer. The structural tests in
  # internal/ui check that a binding exists; only a browser can check that it works,
  # so this job drives the real thing twice — once sending no clicks, once no keys.
  #
  # The fixture is this checkout: it follows the template, so it is a product Canon
  # can read. fetch-depth 0 because transitions come from the ledger's commit
  # history, and a shallow clone has none.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium-headless-shell

      - name: Drive the UI by keyboard, by pointer, and by URL
        run: |
          make build
          ./bin/canon catalogue .
          ./bin/canon serve -addr :8093 -source . -refresh 0 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8093/api/products >/dev/null && break
            sleep 1
          done
          node e2e/keyboard.mjs http://localhost:8093
          node e2e/urls.mjs http://localhost:8093

  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pre-commit hook can be bypassed with --no-verify. This cannot.
      - name: Validate the ledger
        run: |
          python3 .sdlc/bin/validate-plan.py
          python3 .sdlc/bin/validate-skills.py
          python3 .sdlc/bin/check-traceability.py
          python3 .sdlc/bin/check-tracked.py

      - name: Validate workflow syntax
        run: make lint-ci
