# Canon's own schema, describing how this project is actually built.
#
# This is the dogfood: the increment workflow in specs/increment-plan.md is not
# described here, it *is* here. The states below are the ones the ledger uses, the
# two human gates are the two transitions only an admin may make, and an agent's
# grants stop exactly where the process says they should.
#
# If this file and the process ever disagree, one of them is wrong — and that is the
# point of putting the process in a file a pull request has to touch.
version: 1

states:
  - name: planned
    category: open
  - name: approved            # Gate 1: a human agreed to the plan
    category: open
  - name: in_progress
    category: active
  - name: in_review           # verification done, awaiting Gate 2
    category: active
  - name: done                # Gate 2: a human signed off
    category: closed
    requires_evidence: true
  - name: abandoned
    category: closed

transitions:
  - {from: planned, to: approved}
  - {from: planned, to: abandoned}
  - {from: approved, to: in_progress}
  - {from: approved, to: abandoned}
  - {from: in_progress, to: in_review}
  - {from: in_progress, to: abandoned}
  - {from: in_review, to: done}
  - {from: in_review, to: in_progress}   # verification failed, hand it back

fields:
  - name: title
    type: string
    required: true
  - name: tier
    type: enum
    values: ["1", "2", "3", "4"]
  - name: kind
    type: enum
    values: [feature, fix, security, perf, refactor, chore, docs]
  - name: traces
    type: string              # requirement or finding ids this increment satisfies
  - name: scope
    type: text
  - name: rollback
    type: text
  - name: risk
    type: text
  - name: evidence
    type: text

issue_types:
  - name: increment
    fields: [title, tier, kind, traces, scope, rollback, risk, evidence]

# One level: increments do not nest. The ledger is a flat list by design — an
# increment that needs sub-increments is too big, and splitting it is the answer.
hierarchy:
  levels:
    - [increment]

roles:
  # A human may do anything, including both gates, and may record work that
  # happened before it was tracked — an import, or a commit linked after the fact.
  - name: maintainer
    can: [create, delete, reparent, backdate, link, "field:*", "transition:*"]

  # An agent may build and hand over for verification, and may propose the rest.
  # This mirrors AGENTS.md exactly: agents reach in-review, humans decide done.
  - name: agent
    can:
      - create
      - link
      - "field:*"
      - "transition:approved->in_progress"
      - "transition:in_progress->in_review"
      - "transition:in_review->in_progress"
    propose:
      - "transition:planned->approved"     # Gate 1
      - "transition:in_review->done"       # Gate 2
      - "transition:in_progress->abandoned"
      - delete
